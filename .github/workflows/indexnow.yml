name: Ping IndexNow

# Skickar sajtens URL:er till IndexNow en gang per dygn i stallet for vid varje
# deploy. Upprepade bulk-inlamningar pa kort tid gjorde att vardnamnet blockerades
# med 403 (UserForbiddedToAccessSite).
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Skicka URL:er till IndexNow
        run: node scripts/ping-indexnow.mjs
