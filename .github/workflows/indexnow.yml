name: Ping IndexNow

# Skickar sajtens URL:er till IndexNow en gang per dygn i stallet for vid varje
# deploy. Upprepade bulk-inlamningar pa kort tid gjorde att vardnamnet blockerades
# med 403 (UserForbiddedToAccessSite).
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Full historik kravs for att jamfora vad som andrats sedan forra korningen.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Ett rott jobb betyder att inlamningen avvisades (t.ex. 403 fran blockerat
      # vardnamn). Gront betyder att IndexNow tog emot URL-listan.
      - name: Skicka URL:er till IndexNow
        run: node scripts/ping-indexnow.mjs
