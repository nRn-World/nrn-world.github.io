name: Ping IndexNow

# Skickar sajtens URL:er till IndexNow en gang per dygn i stallet for vid varje
# deploy. Upprepade bulk-inlamningar pa kort tid gjorde att vardnamnet blockerades
# med 403 (UserForbiddedToAccessSite).
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Full historik kravs for att jamfora vad som andrats sedan forra korningen.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # .indexnow-state bevaras mellan korningar: unik nyckel per korning gor att
      # cachen alltid sparas, restore-keys plockar upp den senaste. Tappas cachen
      # skickas allt igen, vilket ar sakert men dyrt.
      - name: Restore IndexNow state
        uses: actions/cache@v6
        with:
          path: .indexnow-state
          key: indexnow-state-${{ github.run_id }}
          restore-keys: |
            indexnow-state-

      # Ett rott jobb betyder att inlamningen avvisades (t.ex. 403 fran blockerat
      # vardnamn). Gront betyder att IndexNow tog emot URL-listan.
      - name: Skicka URL:er till IndexNow
        run: node scripts/ping-indexnow.mjs
