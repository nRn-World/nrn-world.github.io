name: Publish AnimalPuzzle to the project hub

# One-off helper: applies the prepared AnimalPuzzle patch on a review branch and
# removes itself in the same commit, so main only ever gains the site content.
on:
  push:
    paths:
      - .github/workflows/publish-animalpuzzle.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the prepared patch on a branch
        run: |
          set -euo pipefail
          git config user.name "nRnWorld"
          git config user.email "132290183+nRn-World@users.noreply.github.com"
          git checkout -b hub/animalpuzzle
          curl -fsSL https://raw.githubusercontent.com/nRn-World/AnimalPuzzle/hub-animalpuzzle-patch/animalpuzzle.patch -o /tmp/animalpuzzle.patch
          git apply --index /tmp/animalpuzzle.patch
          git rm -q .github/workflows/publish-animalpuzzle.yml
          git commit -m "Add AnimalPuzzle to the project hub"
          git push origin hub/animalpuzzle
