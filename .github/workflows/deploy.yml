name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # IndexNow kors inte langre vid varje deploy: upprepade bulk-inlamningar
      # ledde till 403. Det sker i stallet en gang per dygn i indexnow.yml.

      - name: Copy 404 fallback for SPA routing
        run: cp dist/index.html dist/404.html

      - name: Add CNAME
        run: echo "nrnworld.one" > dist/CNAME

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Redirect-reglerna ligger i Cloudflare och foljer inte med bygget, men malen
  # gor det. Svarar ett mal 404 ar redirecten vardelos aven om regeln ar korrekt,
  # sa kontrollen kors efter varje deploy och faller korningen vid trasiga kedjor.
  verify-redirects:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Skriptet har inga beroenden, sa npm ci hoppas over: det gar snabbare och
      # en trasig dependency kan inte blockera redirect-kontrollen.
      - name: Verify legacy redirects
        run: |
          for attempt in 1 2 3; do
            if npm run check:redirects; then
              exit 0
            fi
            echo "Redirect-kontrollen misslyckades (forsok $attempt av 3), vantar 20s..."
            sleep 20
          done
          echo "Redirect-kontrollen misslyckades efter 3 forsok."
          exit 1
